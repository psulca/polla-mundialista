name: cron

# Reemplaza a los crons de Vercel (el plan Hobby solo permite crons diarios).
# Llama a los endpoints protegidos con el header Authorization: Bearer <CRON_SECRET>.
#
# Secretos que hay que cargar en el repo (Settings > Secrets and variables > Actions):
#   APP_URL      → la URL de producción en Vercel, SIN barra final
#                  (ej: https://polla-mundialista.vercel.app)
#   CRON_SECRET  → el mismo valor que pusiste en las env vars de Vercel
on:
  schedule:
    - cron: "*/6 * * * *" # sync de marcadores en vivo (cada ~6 min)
    - cron: "0 11 * * *" # reconcile diario (corrige horarios + finales)
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

# Evita solapamientos si una corrida tarda más que el intervalo.
concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.schedule == '*/6 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/sync
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            "${APP_URL}/api/sync" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  reconcile:
    if: github.event.schedule == '0 11 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/reconcile
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            "${APP_URL}/api/reconcile" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
