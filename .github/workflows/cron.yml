name: cron

# ⚠️ BACKUP MANUAL — el cron oficial vive en Supabase pg_cron:
#   'polla-sync'      → */10 * * * *  (cada 10 min, llama a /api/sync)
#   'polla-reconcile' → 0 11 * * *    (diario 11:00 UTC, llama a /api/reconcile)
# Ambos jobs llaman a https://polla-mundialista-peru.vercel.app con Bearer desde el Vault.
#
# GitHub Actions demostró ser no confiable para schedules (saltos de hasta 3 horas),
# así que este workflow queda SOLO como disparo manual de emergencia (workflow_dispatch).
#
# Secretos que hay que cargar en el repo (Settings > Secrets and variables > Actions):
#   APP_URL      → la URL de producción en Vercel, SIN barra final
#                  (ej: https://polla-mundialista.vercel.app)
#   CRON_SECRET  → el mismo valor que pusiste en las env vars de Vercel
on:
  workflow_dispatch: {} # disparo manual desde la pestaña Actions

# Evita solapamientos si una corrida tarda más que el intervalo.
concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/sync
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            "${APP_URL}/api/sync" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  reconcile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/reconcile
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            "${APP_URL}/api/reconcile" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
